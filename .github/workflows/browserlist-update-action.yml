name: Update Browserslist database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1,15 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-browserslist-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: develop
          # Use PAT so subsequent pushes trigger CI on the PR. Falls back to
          # GITHUB_TOKEN, but PRs opened with it will not trigger downstream
          # workflows (preview-staging.yml), which can leave the PR "blocked".
          token: ${{ secrets.BROWSERLIST_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
      - name: Update Browserslist database
        run: npx update-browserslist-db@latest
      - name: Create PR if there are changes
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BROWSERLIST_TOKEN || secrets.GITHUB_TOKEN }}
          branch: browserslist-update
          base: develop
          commit-message: "build: update Browserslist db"
          title: "build: update Browserslist db"
          body: Auto-generated by update-browserslist-db
          labels: "chores, github action"
          delete-branch: true
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BROWSERLIST_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
